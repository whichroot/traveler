name: Feature request / language proposal
description: Propose a new language feature, stdlib addition, or tooling improvement
title: "feat: <short description>"
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for proposing an improvement to Traveler.

        Traveler is **discuss-first** for anything large or compiler-touching:
        this issue is the right place to align on the design **before** any code
        is written. Language-surface changes especially need a discussion,
        because they interact with the self-hosting fixed point and the
        parallelization soundness model.

  - type: checkboxes
    id: preflight
    attributes:
      label: Pre-flight
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true

  - type: textarea
    id: motivation
    attributes:
      label: Motivation / problem
      description: What problem does this solve? What can't you express (or express well) today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed design
      description: The proposed language surface, API, or behavior. Sketch syntax/signatures where relevant.
      render: rust
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Language surface (syntax / types / traits)
        - Compiler internals / codegen
        - Auto-parallelization
        - Standard library (src/lib/**)
        - Crypto / ZK
        - Tooling (formatter, LSP, doc)
        - Docs / spec
        - Other
    validations:
      required: true

  - type: textarea
    id: invariants
    attributes:
      label: Impact on the invariants
      description: |
        How does this interact with Traveler's load-bearing invariants? Consider:
        the self-hosting fixed point (Stage 2 == Stage 3), auto-parallelization
        soundness (default-deny), and the module size cap. "No impact" is a fine
        answer if true.
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other designs you weighed, and why you prefer this one.
    validations:
      required: false

  - type: checkboxes
    id: participation
    attributes:
      label: Participation
      options:
        - label: I'm willing to help implement this (with guidance if needed).
          required: false
